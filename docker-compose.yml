services:
  travel-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/travel_agent.db
      - SECRET_KEY=change-this-in-production
      - DEBUG=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles:
      - cache
